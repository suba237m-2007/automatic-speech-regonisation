<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Speech Recognition</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🎙️ Automatic Speech Recognition</h1>
            <p>Convert your speech into text easily</p>
        </header>

        <div class="card">

            <div class="controls">

                <label>Select Language</label>

                <select id="language">
                    <option value="en-US">English</option>
                    <option value="ta-IN">Tamil</option>
                    <option value="hi-IN">Hindi</option>
                </select>

                <div class="buttons">
                    <button id="startBtn">🎙️ Start Recording</button>
                    <button id="stopBtn" disabled>⏹️ Stop</button>
                </div>

            </div>

            <div class="status">
                <span id="status">Ready to record</span>
                <span id="timer">00:00</span>
            </div>

            <textarea id="transcript" placeholder="Your recognized speech will appear here..."></textarea>

            <div class="info">
                <span>Words: <b id="wordCount">0</b></span>
                <span>Characters: <b id="charCount">0</b></span>
            </div>

            <div class="action-buttons">
                <button id="copyBtn">📋 Copy</button>
                <button id="clearBtn">🧹 Clear</button>
                <button id="downloadBtn">💾 Download</button>
            </div>

        </div>

        <div class="card upload-card">

            <h2>📂 Upload Audio</h2>

            <input type="file" id="audioFile" accept="audio/*">

            <button id="uploadBtn">⬆️ Upload & Convert</button>

            <p id="uploadStatus"></p>

        </div>

        <footer>
            <p>Automatic Speech Recognition System | AI Project</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
